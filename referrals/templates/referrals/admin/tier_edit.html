{% extends "base.html" %}
{% load i18n %}
{% block title %}{% trans "Modifier un niveau" %}{% endblock %}
{% block content %}
<div class="container py-4"><h1 class="h2 mb-3">{% trans "Modifier le niveau" %}</h1>
<form method="post" class="card"><div class="card-body">{% csrf_token %}{% for field in form %}<div class="mb-3"><label class="form-label" for="{{ field.id_for_label }}">{{ field.label }}</label>{{ field }}{% for error in field.errors %}<div class="text-danger small">{{ error }}</div>{% endfor %}</div>{% endfor %}<button class="btn btn-primary" type="submit">{% trans "Enregistrer" %}</button></div></form></div>
{% endblock %}
