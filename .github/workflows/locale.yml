name: Update Locale Files

on:
  workflow_dispatch:
    inputs:
      languages:
        description: 'Lang yo (separe pa espas)'
        required: true
        default: 'ht fr'

jobs:
  update-locale:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install django
        pip install -r requirements.txt 2>/dev/null || true
    
    - name: Remove old locale files
      run: |
        find . -name "*.po" -delete
        find . -name "*.mo" -delete
        find . -type d -name "locale" -exec rm -rf {} +
    
    - name: Create locale directories
      run: |
        mkdir -p locale/fr/LC_MESSAGES
        mkdir -p locale/ht/LC_MESSAGES
    
    - name: Run makemessages for each language
      run: |
        for lang in ${{ github.event.inputs.languages }}; do
          echo "Processing language: $lang"
          python manage.py makemessages -l $lang --no-obsolete
        done
    
    - name: Compile messages
      run: |
        python manage.py compilemessages
    
    - name: List generated files
      run: |
        echo "=== Fichye locale yo ==="
        find locale -type f -name "*.po" -o -name "*.mo" | sort
    
    - name: Commit and push
      run: |
        git config user.name "GitHub Actions"
        git config user.email "actions@github.com"
        git add .
        git commit -m "Auto: Regenerated locale files for ${{ github.event.inputs.languages }}" || echo "No changes to commit"
        git push