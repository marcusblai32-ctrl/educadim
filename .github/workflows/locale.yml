name: Update Locale Files

on:
  workflow_dispatch:
    inputs:
      languages:
        description: 'Lang yo (separe pa espas)'
        required: true
        default: 'ht fr en'

jobs:
  update-locale:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
    
    - name: Install Django
      run: pip install django
    
    - name: Remove old locale files
      run: |
        find . -name "*.po" -delete
        find . -name "*.mo" -delete
        find . -type d -name "locale" -exec rm -rf {} +
    
    - name: Run makemessages
      run: |
        for lang in ${{ github.event.inputs.languages }}; do
          python manage.py makemessages -l $lang
        done
    
    - name: Compile messages
      run: python manage.py compilemessages
    
    - name: Commit and push
      run: |
        git config user.name "GitHub Actions"
        git config user.email "actions@github.com"
        git add .
        git commit -m "Auto: Regenerated locale files" || echo "No changes"
        git push