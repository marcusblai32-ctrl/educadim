name: Compile Locale and Verify

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  compile-locale:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v3
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        fetch-depth: 0
    
    - name: Install gettext
      run: |
        sudo apt-get update
        sudo apt-get install -y gettext
    
    - name: Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
    
    - name: Install Django
      run: |
        pip install django
        pip install -r requirements.txt 2>/dev/null || true
    
    - name: Compile all messages
      run: |
        # Konpile tout .po fichye yo
        find locale -name "*.po" -exec msgfmt {} -o {}.mo \; 2>/dev/null
        # Oswa si Django mache
        python manage.py compilemessages 2>&1 || true
        echo "=== .mo files created ==="
        find locale -name "*.mo" -type f
    
    - name: Verify translations
      run: |
        # Verifye si .mo files yo gen kontni
        for mo_file in $(find locale -name "*.mo"); do
          echo "--- $mo_file ---"
          strings "$mo_file" | head -20
          echo ""
        done
    
    - name: Commit and push
      run: |
        git config user.name "GitHub Actions"
        git config user.email "actions@github.com"
        git add locale/
        git status
        git commit -m "Compile locale files (.mo)" || echo "No changes"
        git push origin HEAD:main