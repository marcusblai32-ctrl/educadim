name: Create Locale Files FR and HT

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  create-locale:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v3
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        fetch-depth: 0
    
    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y gettext
        echo "✅ gettext installed"
        msgfmt --version
    
    - name: Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
    
    - name: Install Django
      run: |
        python -m pip install --upgrade pip
        pip install django
        pip install -r requirements.txt 2>/dev/null || true
    
    - name: Create FR locale (French - Default)
      run: |
        echo "🔄 Creating French locale files..."
        mkdir -p locale/fr/LC_MESSAGES
        python manage.py makemessages -l fr --no-obsolete 2>&1 || echo "makemessages fr failed"
        echo "✅ French locale created"
    
    - name: Create HT locale (Haitian Creole)
      run: |
        echo "🔄 Creating Haitian Creole locale files..."
        mkdir -p locale/ht/LC_MESSAGES
        python manage.py makemessages -l ht --no-obsolete 2>&1 || echo "makemessages ht failed"
        echo "✅ Haitian Creole locale created"
    
    - name: Verify files
      run: |
        echo "=== FR files ==="
        find locale/fr -type f 2>/dev/null
        echo "=== HT files ==="
        find locale/ht -type f 2>/dev/null
        echo "=== All locale files ==="
        find locale -type f
    
    - name: Compile messages
      run: |
        python manage.py compilemessages 2>&1 || echo "compilemessages failed"
    
    - name: List compiled files
      run: |
        echo "=== Compiled .mo files ==="
        find locale -name "*.mo" -type f
    
    - name: Commit and push
      run: |
        git config user.name "GitHub Actions"
        git config user.email "actions@github.com"
        git add locale/
        git status
        git commit -m "Create locale files: fr (default) and ht" || echo "No changes"
        git push origin HEAD:main