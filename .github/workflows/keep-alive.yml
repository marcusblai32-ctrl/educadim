name: Check Render App

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Check Render app
        run: |
          curl --fail --silent --show-error \
            --max-time 30 \
            https://educadim.onrender.com/health/ \
            --output /dev/null