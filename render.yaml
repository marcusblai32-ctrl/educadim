services:
  - type: web
    name: educadim
    runtime: python
    plan: free

    buildCommand: "./build.sh"
    startCommand: "gunicorn config.wsgi:application"

    envVars:
      - key: SECRET_KEY
        generateValue: true

      - key: DEBUG
        value: "false"

      - key: BREVO_API_KEY
        sync: false

      - key: BREVO_SENDER_EMAIL
        sync: false

      - key: BREVO_SENDER_NAME
        sync: false

      - key: TELERIVET_API_KEY
        sync: false

      - key: TELERIVET_PROJECT_ID
        sync: false

      - key: SITE_NAME
        value: "EducaDim"

      - key: SITE_URL
        value: "https://educadim.onrender.com"